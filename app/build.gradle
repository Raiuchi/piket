plugins {
    id 'com.android.application'
}

android {
    namespace 'net.raiuchi.piket'
    compileSdk 34

    defaultConfig {
        applicationId "net.raiuchi.piket"
        minSdk 26
        targetSdk 34
        versionCode 105
        versionName "1.4.99"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        // Ключ и его реквизиты не хранятся в публичном репозитории.
        // CI восстанавливает keystore из GitHub Secret PIKET_KEYSTORE_B64.
        // Для ручной сборки положить app/piket-release.keystore и local.properties
        // (оба игнорируются Git) со строками:
        //      PIKET_KEYSTORE_PASSWORD=...
        //      PIKET_KEY_ALIAS=piket-v2
        //      PIKET_KEY_PASSWORD=...
        def localProps = new Properties()
        def localFile = rootProject.file("local.properties")
        if (localFile.exists()) {
            localProps.load(new FileInputStream(localFile))
        }
        piket {
            storeFile file("piket-release.keystore")
            storePassword System.getenv("PIKET_KEYSTORE_PASSWORD") ?: localProps.getProperty("PIKET_KEYSTORE_PASSWORD")
            keyAlias System.getenv("PIKET_KEY_ALIAS") ?: localProps.getProperty("PIKET_KEY_ALIAS")
            keyPassword System.getenv("PIKET_KEY_PASSWORD") ?: localProps.getProperty("PIKET_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug {
            // Standard debug key keeps local/emulator tests independent from release secrets.
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.piket
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
}
