plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'net.raiuchi.piket'
    compileSdk 34

    defaultConfig {
        applicationId "net.raiuchi.piket"
        minSdk 26
        targetSdk 34
        versionCode 109
        versionName "2.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        // Ключ и его реквизиты не хранятся в публичном репозитории.
        // CI восстанавливает keystore из GitHub Secret PIKET_KEYSTORE_B64.
        // Для ручной сборки положить app/piket-release.keystore и local.properties
        // (оба игнорируются Git) со строками:
        //      PIKET_KEYSTORE_PASSWORD=...
        //      PIKET_KEY_ALIAS=piket-v2
        //      PIKET_KEY_PASSWORD=...
        def localProps = new Properties()
        def localFile = rootProject.file("local.properties")
        if (localFile.exists()) {
            localProps.load(new FileInputStream(localFile))
        }
        piket {
            storeFile file("piket-release.keystore")
            storePassword System.getenv("PIKET_KEYSTORE_PASSWORD") ?: localProps.getProperty("PIKET_KEYSTORE_PASSWORD")
            keyAlias System.getenv("PIKET_KEY_ALIAS") ?: localProps.getProperty("PIKET_KEY_ALIAS")
            keyPassword System.getenv("PIKET_KEY_PASSWORD") ?: localProps.getProperty("PIKET_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug {
            // Standard debug key keeps local/emulator tests independent from release secrets.
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.piket
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.core:core-ktx:1.13.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
}
